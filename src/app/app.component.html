<!-- Overlay global de loading -->
<div *ngIf="loading$ | async" class="loading-overlay">
  <div class="spinner-container">
    <mat-spinner diameter="60"></mat-spinner>
    <p>Cargando...</p>
  </div>
</div>

<router-outlet></router-outlet>

<!-- Recorrido Guiado (Spotlight Overlay) -->
<app-onboarding-tour *ngIf="tourService.isActive$ | async"></app-onboarding-tour>

<!-- Aviso global de modo offline -->
<div *ngIf="(isOnline$ | async) === false" class="global-offline-banner">
  <mat-icon>cloud_off</mat-icon>
  <span>Modo Offline</span>
</div>
