<div class="confirm-sale-header" style="display: flex; justify-content: space-between; align-items: center;">
  <div style="display: flex; align-items: center; gap: 8px;">
    <mat-icon color="primary" class="header-icon">payment</mat-icon>
    <h1 style="margin: 0; padding: 0; line-height: 1; display: flex; align-items: center;">Confirmar Venta</h1>
  </div>
  <button mat-icon-button (click)="onCancel()" tabindex="-1" class="close-btn" style="color: var(--talavera-muted); margin-right: -8px;">
    <mat-icon>close</mat-icon>
  </button>
</div>

<div mat-dialog-content>
  <p class="total-display">Total a Pagar:</p>
  <div class="total-amount">{{ data.total | currency:'USD':'symbol':'1.2-2' }}</div>
  <p>¿Deseas registrar esta venta?</p>
</div>

<div mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">Cancelar</button>
  <button mat-raised-button color="primary" (click)="onConfirm()" cdkFocusInitial>
    Confirmar y Cobrar
  </button>
</div>
