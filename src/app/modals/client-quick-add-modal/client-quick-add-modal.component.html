<div style="display: flex; justify-content: space-between; align-items: center; padding: 24px 24px 0 24px;">
  <h1 style="margin: 0; padding: 0; font-size: 1.5rem; font-weight: 700; color: var(--talavera-ink); line-height: 1; display: flex; align-items: center;">Crear Cliente Nuevo</h1>
  <button mat-icon-button (click)="onCancel()" tabindex="-1" style="color: var(--talavera-muted); margin-right: -8px;">
    <mat-icon>close</mat-icon>
  </button>
</div>

<div mat-dialog-content>
  <form [formGroup]="clientForm" class="dialog-form">

    <mat-form-field appearance="outline" class="form-field-full">
      <mat-label>Nombre Completo</mat-label>
      <input matInput formControlName="name" required placeholder="Ej. Juan Pérez">
      <mat-icon matSuffix>person</mat-icon>
    </mat-form-field>

    <mat-form-field appearance="outline" class="form-field-full">
      <mat-label>Correo Electrónico</mat-label>
      <input matInput type="email" formControlName="email" required placeholder="ejemplo@correo.com">
      <mat-icon matSuffix>email</mat-icon>
    </mat-form-field>

    <mat-form-field appearance="outline" class="form-field-full">
      <mat-label>Teléfono</mat-label>
      <input matInput type="tel" formControlName="phone" required placeholder="555-1234">
      <mat-icon matSuffix>phone</mat-icon>
    </mat-form-field>

  </form>
</div>

<div mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">Cancelar</button>
  <button mat-raised-button color="primary" (click)="onSave()" [disabled]="clientForm.invalid">
    Guardar Cliente
  </button>
</div>
