<div class="success-modal-container" style="position: relative;">
  <button mat-icon-button (click)="onClose()" tabindex="-1" class="close-btn" style="position: absolute; top: 8px; right: 8px; color: var(--talavera-muted);">
    <mat-icon>close</mat-icon>
  </button>
  <div class="modal-header">
    <div class="success-icon-wrapper">
      <mat-icon class="success-icon">check_circle</mat-icon>
    </div>
    <h2>¡Venta Exitosa!</h2>
    <p class="subtitle">La venta #{{data.saleId}} ha sido registrada correctamente.</p>
  </div>

  <div class="modal-body">
    <!-- WhatsApp Ticket Section -->
    <div class="dispatch-group">
      <mat-form-field appearance="outline" class="full-width" subscriptSizing="dynamic">
        <mat-label>Enviar ticket por WhatsApp</mat-label>
        <input matInput [(ngModel)]="whatsappPhone" type="tel" placeholder="Número de celular con o sin prefijo">
        <mat-icon matPrefix>phone_iphone</mat-icon>
        <button mat-flat-button color="accent" matSuffix (click)="sendWhatsAppTicket()" [disabled]="!whatsappPhone" class="whatsapp-btn">
          <mat-icon>send</mat-icon>
          Enviar
        </button>
      </mat-form-field>
    </div>

    <!-- Email Ticket Section -->
    <div class="dispatch-group" [formGroup]="emailForm">
      <mat-form-field appearance="outline" class="full-width" subscriptSizing="dynamic">
        <mat-label>Enviar ticket por correo (Opcional)</mat-label>
        <input matInput formControlName="email" type="email" placeholder="ejemplo@correo.com">
        <mat-icon matPrefix>mail</mat-icon>
        <button mat-flat-button color="primary" matSuffix (click)="sendEmail()" [disabled]="emailForm.invalid || !emailForm.value.email || isSending" class="email-btn">
          <mat-spinner diameter="18" *ngIf="isSending" class="btn-spinner"></mat-spinner>
          <mat-icon [style.display]="isSending ? 'none' : 'inline-block'">send</mat-icon>
          {{ isSending ? 'Enviando...' : 'Enviar' }}
        </button>
        <mat-error *ngIf="emailForm.get('email')?.hasError('email')">Formato inválido</mat-error>
      </mat-form-field>
    </div>
  </div>

  <div class="modal-footer">
    <button mat-stroked-button (click)="onClose()" class="skip-btn">
      Nueva Venta
    </button>
    
    <span class="tooltip-wrapper" matTooltip="Configura tu impresora térmica primero en el menú Hardware" matTooltipPosition="above" [matTooltipDisabled]="(isPrinterConnected$ | async) === true" [style.cursor]="(isPrinterConnected$ | async) ? 'default' : 'not-allowed'">
      <button mat-stroked-button color="accent" (click)="printTicket()" [disabled]="!(isPrinterConnected$ | async)" class="print-btn">
        <mat-icon>print</mat-icon>
        Imprimir
      </button>
    </span>
  </div>
</div>
