<div class="success-modal-container" style="position: relative;">
  <button mat-icon-button (click)="onClose()" tabindex="-1" class="close-btn" style="position: absolute; top: 8px; right: 8px; color: var(--talavera-muted);">
    <mat-icon>close</mat-icon>
  </button>
  <div class="modal-header">
    <div class="success-icon-wrapper">
      <mat-icon class="success-icon">check_circle</mat-icon>
    </div>
    <h2>¡Venta Exitosa!</h2>
    <p class="subtitle">La venta #{{data.saleId}} ha sido registrada correctamente.</p>
  </div>

  <div class="modal-body" [formGroup]="emailForm">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Enviar ticket por correo (Opcional)</mat-label>
      <input matInput formControlName="email" type="email" placeholder="ejemplo@correo.com">
      <mat-icon matPrefix>mail</mat-icon>
      <mat-error *ngIf="emailForm.get('email')?.hasError('email')">Formato inválido</mat-error>
    </mat-form-field>
  </div>

  <div class="modal-footer">
    <button mat-stroked-button (click)="onClose()" class="skip-btn">
      Nueva Venta
    </button>
    
    <span class="tooltip-wrapper" matTooltip="Configura tu impresora térmica primero en el menú Hardware" matTooltipPosition="above" [matTooltipDisabled]="(isPrinterConnected$ | async) === true" [style.cursor]="(isPrinterConnected$ | async) ? 'default' : 'not-allowed'">
      <button mat-stroked-button color="accent" (click)="printTicket()" [disabled]="!(isPrinterConnected$ | async)" class="full-width-btn">
        <mat-icon>print</mat-icon>
        Imprimir
      </button>
    </span>

    <button mat-raised-button color="primary" (click)="sendEmail()" [disabled]="emailForm.invalid || !emailForm.value.email || isSending" class="send-btn">
      <mat-spinner diameter="20" *ngIf="isSending" class="btn-spinner"></mat-spinner>
      <mat-icon [style.display]="isSending ? 'none' : 'inline-block'">send</mat-icon>
      <span [style.display]="isSending ? 'none' : 'inline'">Enviar</span>
      <span [style.display]="isSending ? 'inline' : 'none'">Enviando...</span>
    </button>
  </div>
</div>
