<div class="warning-header" style="display: flex; justify-content: space-between; align-items: center;">
  <div style="display: flex; align-items: center; gap: 8px;">
    <mat-icon color="warn">warning</mat-icon>
    <h1 mat-dialog-title style="margin: 0; padding: 0;">Advertencia de Stock Bajo</h1>
  </div>
  <button mat-icon-button (click)="onOkClick()" tabindex="-1" class="close-btn" style="color: var(--talavera-muted);">
    <mat-icon>close</mat-icon>
  </button>
</div>

<div mat-dialog-content>
  <p>¡Venta registrada! Sin embargo, los siguientes productos están por agotarse:</p>

  <mat-list role="list">
    <mat-list-item *ngFor="let product of data.products" role="listitem">
      <mat-icon matListItemIcon>inventory_2</mat-icon>
      <div matListItemTitle>{{ product.nombre }}</div>
      <div matListItemLine>
        Quedan solo <strong>{{ product.cantidad_stock }}</strong> unidades.
      </div>
    </mat-list-item>
  </mat-list>
</div>

<div mat-dialog-actions align="end">
  <button mat-raised-button color="primary" (click)="onOkClick()" cdkFocusInitial>
    Entendido
  </button>
</div>
