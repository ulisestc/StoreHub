<div class="modal-container">
  <div class="modal-header">
    <h1 mat-dialog-title>Registrar Ajuste</h1>
  </div>

  <div mat-dialog-content>
    <form [formGroup]="adjustForm" class="dialog-form">

      <mat-form-field appearance="outline" class="form-field-full">
        <mat-label>Producto</mat-label>
        <mat-select formControlName="producto" required>
          <mat-option>
            <ngx-mat-select-search [formControl]="searchControl" placeholderLabel="Buscar por nombre o SKU..." noEntriesFoundLabel="No se encontraron productos"></ngx-mat-select-search>
          </mat-option>
          <mat-option *ngFor="let prod of products$ | async" [value]="prod.id">
            {{ prod.name }} (Stock: {{ prod.stock }})
          </mat-option>
        </mat-select>
        <mat-icon matPrefix>inventory_2</mat-icon>
      </mat-form-field>

      <mat-form-field appearance="outline" class="form-field-full">
        <mat-label>Tipo de Movimiento</mat-label>
        <mat-select formControlName="tipo_movimiento" required>
          <mat-option *ngFor="let tipo of tiposMovimiento" [value]="tipo.value">
            {{ tipo.label }}
          </mat-option>
        </mat-select>
        <mat-icon matPrefix>swap_vert</mat-icon>
      </mat-form-field>

      <mat-form-field appearance="outline" class="form-field-full">
        <mat-label>Cantidad</mat-label>
        <input matInput type="number" formControlName="cantidad" required min="1">
        <mat-icon matPrefix>numbers</mat-icon>
      </mat-form-field>

    </form>
  </div>

  <div mat-dialog-actions align="end" class="modal-actions">
    <button mat-button (click)="onCancel()" class="cancel-btn">Cancelar</button>
    <button mat-raised-button color="primary" (click)="onSave()" [disabled]="adjustForm.invalid">
      Guardar Ajuste
    </button>
  </div>
</div>
